name: CI Pipeline Branche Dev

on:
  push:
    branches:
      - dev

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  IMAGE_TAG: dev-${{ github.run_number }}

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --tag ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} \
            --tag ${{ env.DOCKER_IMAGE }}:dev-latest \
            .

      - name: Sauvegarder image
        run: docker save ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} -o /tmp/image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  security-scan:
    name: Scan Securite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telecharger image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Charger image
        run: docker load -i /tmp/image.tar

      - name: Installer Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Scan vulnerabilites
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Scan secrets
        run: |
          trivy fs \
            --scanners secret \
            --exit-code 0 \
            --format table \
            .

  push:
    name: Push Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Telecharger image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Charger image
        run: docker load -i /tmp/image.tar

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_IMAGE }}:dev-latest

      - name: Resume
        run: echo "Push termine avec succes !"