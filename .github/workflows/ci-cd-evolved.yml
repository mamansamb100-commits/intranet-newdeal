name: CI/CD Évolué – Slim + Blocage CRITICAL + Notification Email

on:
  push:
    branches:
      - dev
      - prod

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  IMAGE_TAG: ${{ github.ref_name }}-slim-${{ github.run_number }}

jobs:

  build-slim:
    name: Build nginx-slim
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image slim
        run: |
          sed -i 's|FROM nginx:alpine3.23$|FROM nginx:alpine|' Dockerfile
          docker build --tag ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} .

      - name: Sauvegarder image
        run: docker save ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} -o /tmp/image-slim.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-slim
          path: /tmp/image-slim.tar
          retention-days: 1

  security-block:
    name: Scan – Blocage si CRITICAL
    runs-on: ubuntu-latest
    needs: build-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Télécharger image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim
          path: /tmp

      - name: Charger image
        run: docker load -i /tmp/image-slim.tar

      - name: Installer Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y && sudo apt-get install -y trivy

      - name: Scan CRITICAL – BLOQUE si trouvé
        run: |
          trivy image --severity CRITICAL --exit-code 1 --format table ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Scan HIGH – avertissement
        run: |
          trivy image --severity HIGH --exit-code 0 --format table ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

  push-slim:
    name: Push Docker Hub
    runs-on: ubuntu-latest
    needs: security-block
    steps:
      - name: Télécharger image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim
          path: /tmp

      - name: Charger image
        run: docker load -i /tmp/image-slim.tar

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} ${{ env.DOCKER_IMAGE }}:slim-latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_IMAGE }}:slim-latest

  notify:
    name: Notification Email
    runs-on: ubuntu-latest
    needs: [build-slim, security-block, push-slim]
    if: always()
    steps:
      - name: Statut global
        id: status
        run: |
          if [[ "${{ needs.build-slim.result }}" == "success" && "${{ needs.security-block.result }}" == "success" && "${{ needs.push-slim.result }}" == "success" ]]; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=FAILURE" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Envoyer email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.emoji }} Pipeline ${{ steps.status.outputs.status }} | Branche ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI/CD MCTIC <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Pipeline: ${{ steps.status.outputs.status }}
            Branche: ${{ github.ref_name }}
            Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Auteur: ${{ github.actor }}